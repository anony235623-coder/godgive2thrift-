<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>GodGive2Thrift Admin</title>

<link rel="stylesheet" href="/css/admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="layout">

<!-- Sidebar -->

<aside class="sidebar">

<h2>

<i class="fa-solid fa-store"></i>

GodGive2Thrift

</h2>

<a href="#dashboard">

<i class="fa-solid fa-gauge"></i>

Dashboard

</a>

<a href="#products">

<i class="fa-solid fa-shirt"></i>

Products

</a>

<a href="#orders">

<i class="fa-solid fa-box"></i>

Orders

</a>

<a href="#analytics">

<i class="fa-solid fa-chart-line"></i>

Analytics

</a>

<a href="/">

<i class="fa-solid fa-house"></i>

Website

</a>

<a href="#"

onclick="logout();return false;">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</aside>

<!-- Main -->

<main class="main">

<header>

<h1>

Admin Dashboard

</h1>

<p id="welcome">

Loading...

</p>

</header>

<section class="cards">

<div class="card">

<h3>Products</h3>

<h1 id="totalProducts">

0

</h1>

</div>

<div class="card">

<h3>Orders</h3>

<h1 id="totalOrders">

0

</h1>

</div>

<div class="card">

<h3>Customers</h3>

<h1 id="totalCustomers">

0

</h1>

</div>

<div class="card">

<h3>Revenue</h3>

<h1 id="revenue">

₱0

</h1>

</div>

</section>

<section class="chart-box">

<h2>

Monthly Revenue

</h2>

<canvas id="monthlyChart">

</canvas>

</section>

<section id="products">

<div class="section-header">

<h2>Products</h2>

<button class="add-btn" onclick="openProductModal()">

<i class="fa-solid fa-plus"></i>

Add Product

</button>

</div>

<div id="productTable">

Loading...

</div>

</section>

</main>

</div>
<div id="productModal" class="modal">

<div class="modal-content">

<span class="close" onclick="closeProductModal()">

&times;

</span>

<h2 id="modalTitle">
<input
type="hidden"
id="productId">
Add Product

</h2>

<input id="name" placeholder="Product Name">

<input id="price" type="number" placeholder="Price">

<select id="category">

    <option value="">Select Category</option>

    <option>Jacket</option>

    <option>Hoodie</option>

    <option>Shirt</option>

    <option>Pants</option>

    <option>Shoes</option>

    <option>Accessories</option>

</select>

<input id="stock" type="number" placeholder="Stock">

<textarea
id="description"
placeholder="Description"></textarea>

<input
type="file"
id="imageFile"
accept="image/*">

<img
id="preview"
class="preview">

<button
id="saveButton"
class="save-btn"
onclick="saveProduct()">

💾 Save Product

</button>

</div>

</div>
<script src="/js/admin.js"></script>

</body>

</html>
