<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | GodGive2Thrift</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

button,
.checkout,
.qty button,
.remove{
    transition:.25s ease;
}

body{
    background:#f4f4f4;
}

.logo{
    color:#D4AF37;
}

.container{
    width:90%;
    max-width:1300px;
    margin:40px auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
}

.cart-box,
.summary{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.summary{
    position:sticky;
    top:100px;
    height:fit-content;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 0;
    border-bottom:1px solid #eee;
}

.product{
    display:flex;
    align-items:center;
    gap:20px;
}

.product img{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:10px;
}

.qty button{
    width:38px;
    height:38px;
    border:none;
    background:#1E293B;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.qty button:hover{
    background:#F59E0B;
    color:black;
}

.remove{
    background:#dc3545;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.remove:hover{
    background:#b02a37;
}

.summary h2{
    margin-bottom:20px;
}

.summary div{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
}

.checkout{
    display:block;
    width:100%;
    padding:16px;
    background:#1E293B;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:12px;
    font-weight:600;
}

.checkout:hover{
    background:#F59E0B;
    color:black;
    transform:translateY(-3px);
}

.empty-cart{
    text-align:center;
    padding:50px 20px;
}

.empty-cart i{
    font-size:70px;
    color:#ccc;
    margin-bottom:20px;
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.summary{
    position:static;
}

}

</style>

</head>

<body>

<header>

    <h1 class="logo">GodGive2Thrift</h1>

    <nav id="navbar">

        <a href="/">Home</a>

        <a href="/shop">Shop</a>

        <a href="/cart">Cart</a>

        <span id="accountMenu">

            <a href="/login">Login</a>

        </span>

    </nav>

</header>


<div class="container">

<div class="cart-box">

<div class="cart-box">

    <h2>🛒 Your Shopping Cart</h2>

    <div id="cartItems">

    </div>

</div>

</div>

<div class="summary">

<h2>Order Summary</h2>

<div>

<span>Subtotal</span>

<strong id="subtotal">₱0</strong>

</div>

<div>

<span>🚚 Shipping Fee</span>

<strong>₱100</strong>

</div>

<hr>

<div>

<h3>💰 Total Payment</h3>

<h3 id="grandTotal">₱100</h3>

</div>

<a href="/checkout" class="checkout">

Proceed to Checkout

</a>

</div>

</div>

<script src="/js/cart.js"></script>
<script src="/js/auth.js"></script>

</body>

</html>
