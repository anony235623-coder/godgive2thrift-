<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | GodGive2Thrift</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

button,
.checkout,
.qty button,
.remove{
    transition:.25s ease;
}

body{
    background:#f4f4f4;
}

.logo{
    color:#D4AF37;
}

.container{
    width:90%;
    max-width:1300px;
    margin:40px auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
}

.cart-box,
.summary{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.summary{
    position:sticky;
    top:100px;
    height:fit-content;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 0;
    border-bottom:1px solid #eee;
}

.product{
    display:flex;
    align-items:center;
    gap:20px;
}

.product img{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:10px;
}

.qty button{
    width:38px;
    height:38px;
    border:none;
    background:#1E293B;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.qty button:hover{
    background:#F59E0B;
    color:black;
}

.remove{
    background:#dc3545;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.remove:hover{
    background:#b02a37;
}

.summary h2{
    margin-bottom:20px;
}

.summary div{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
}

.checkout{
    display:block;
    width:100%;
    padding:16px;
    background:#1E293B;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:12px;
    font-weight:600;
}

.checkout:hover{
    background:#F59E0B;
    color:black;
    transform:translateY(-3px);
}

.empty-cart{
    text-align:center;
    padding:50px 20px;
}

.empty-cart i{
    font-size:70px;
    color:#ccc;
    margin-bottom:20px;
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.summary{
    position:static;
}

}
.empty-cart{

    text-align:center;

    padding:70px 20px;

}

.empty-cart i{

    font-size:90px;

    color:#D4AF37;

    margin-bottom:20px;

}

.empty-cart h3{

    font-size:34px;

    margin:10px 0;

}

.empty-cart p{

    color:#777;

    margin-bottom:25px;

}

.empty-cart .shop-btn{

    display:inline-block;

    background:#1E293B;

    color:white;

    padding:15px 30px;

    border-radius:12px;

    text-decoration:none;

    font-weight:600;

}

.empty-cart .shop-btn:hover{

    background:#D4AF37;

    color:black;

}
/* ===========================
   CART NAVBAR
=========================== */

#navbar a{

    color:#1E293B;

}

#navbar a:hover{

    color:#D4AF37;

}

.logo a{

    color:#D4AF37;

    text-decoration:none;

}

.logo{

    margin:0;

}
header{

    position:sticky;

    top:0;

    z-index:999;

    background:white;

    padding:20px 50px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 5px 20px rgba(0,0,0,.08);

}
header{
    position:sticky;
    top:0;
    z-index:999;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(12px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.logo a{
    text-decoration:none;
    color:#D4AF37;
    font-size:34px;
    font-weight:700;
}

#navbar{
    display:flex;
    align-items:center;
    gap:30px;
}

#navbar a{
    color:#222;
    text-decoration:none;
    font-weight:600;
}

#navbar a.active{
    color:#D4AF37;
}

#navbar a:hover{
    color:#D4AF37;
}

.cart-header{
    margin-bottom:30px;
}

.cart-header h2{
    font-size:32px;
    margin-bottom:10px;
}

.cart-header p{
    color:#777;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin:18px 0;
    font-size:17px;
}

.summary-row.total{
    font-size:22px;
    font-weight:bold;
}

.summary hr{
    border:none;
    border-top:1px solid #eee;
    margin:20px 0;
}

.checkout{
    margin-top:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}
</style>

</head>

<body>

<header>

    <h1 class="logo">
        <a href="/">
            GodGive2Thrift
        </a>
    </h1>

    <nav id="navbar">

        <a href="/">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <a href="/shop">
            <i class="fa-solid fa-store"></i>
            Shop
        </a>

        <a href="/cart" class="active">
            <i class="fa-solid fa-cart-shopping"></i>
            Cart
        </a>

        <span id="accountMenu">

            <a href="/login">
                <i class="fa-solid fa-user"></i>
                Login
            </a>

        </span>

    </nav>

</header>

<div class="container">

    <section class="cart-box">

        <div class="cart-header">

            <h2>
                <i class="fa-solid fa-cart-shopping"></i>
                Shopping Cart
            </h2>

            <p>
                Review your selected thrift items before checkout.
            </p>

        </div>

        <div id="cartItems">

            <!-- Cart items will appear here -->

        </div>

    </section>

    <aside class="summary">

        <h2>
            Order Summary
        </h2>

        <div class="summary-row">

            <span>Subtotal</span>

            <span id="subtotal">
                ₱0
            </span>

        </div>

        <div class="summary-row">

            <span>
                <i class="fa-solid fa-truck"></i>
                Shipping Fee
            </span>

            <span id="shipping">
                ₱100
            </span>

        </div>

        <hr>

        <div class="summary-row total">

            <span>Total</span>

            <span id="total">
                ₱100
            </span>

        </div>

        <a
            href="/checkout"
            id="checkoutBtn"
            class="checkout">

            <i class="fa-solid fa-credit-card"></i>

            Proceed to Checkout

        </a>

    </aside>

</div>


<script src="/js/cart.js"></script>
<script src="/js/auth.js"></script>

</body>

</html>
