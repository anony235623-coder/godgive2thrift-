<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | GodGive2Thrift</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    transition:.25s ease;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    background:#111;
}

.container{
    display:flex;
    height:100vh;
}


/* LEFT SIDE */

.left{
    width:50%;
    background:
    linear-gradient(
        rgba(0,0,0,.65),
        rgba(0,0,0,.65)
    ),
    url("https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=1200");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    color:white;
}

.left h1{
    color:#D4AF37;
    font-size:50px;
    margin-bottom:20px;
}

.left p{
    font-size:20px;
}


/* RIGHT SIDE */

.right{
    width:50%;
    background:white;

    display:flex;
    justify-content:center;
    align-items:center;
}


.login-box{

    width:380px;

}


.login-box h2{

    text-align:center;
    font-size:32px;
    margin-bottom:10px;

}


.login-box .subtitle{

    text-align:center;
    color:#777;
    margin-bottom:30px;

}



/* INPUT */

.input-box{

    position:relative;
    margin-bottom:20px;

}


.input-box i{

    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);

    color:#777;

}


.input-box input{

    width:100%;

    padding:15px 45px;

    border:1px solid #ccc;

    border-radius:10px;

    font-size:16px;

    outline:none;

}


.input-box input:focus{

    border-color:#D4AF37;

}



/* PASSWORD EYE */

.password-eye{

    position:absolute;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:#777;

}



/* BUTTON */


button{

    background:#1E293B;

    color:white;

    border:none;

    padding:14px 22px;

    border-radius:12px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:all .25s ease;

}

button:hover{

    background:#F59E0B;

    color:black;

    transform:translateY(-3px);

    box-shadow:0 12px 25px rgba(0,0,0,.18);

}

button:active{

    transform:scale(.97);

}



/* REGISTER */


.register{

    text-align:center;

    margin-top:25px;

}


.register a{

    color:#D4AF37;

    font-weight:bold;

    text-decoration:none;

}



/* MOBILE */


@media(max-width:900px){

.left{

    display:none;

}

.right{

    width:100%;

}

}

</style>

</head>


<body>


<div class="container">


<div class="left">

<div>

<h1>
GodGive2Thrift
</h1>

<p>
Premium Vintage Collection

Affordable • Authentic • One of a Kind
<br>
Affordable • Authentic • Vintage
</p>

</div>

</div>



<div class="right">


<div class="login-box">


<h2>
Welcome Back 👋
</h2>


<p class="subtitle">
Login to continue shopping
</p>



<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input 
type="email"
id="email"
placeholder="Email">


</div>




<div class="input-box">


<i class="fa-solid fa-lock"></i>


<input 
type="password"
id="password"
placeholder="Password">



<i 
class="fa-solid fa-eye password-eye"
onclick="showPassword()">
</i>


</div>



<button onclick="login()">

Login

</button>



<div class="register">

Don't have an account?

<a href="/register">
Create Account
</a>


</div>


</div>


</div>


</div>




<script>


function showPassword(){

let pass=document.getElementById("password");

if(pass.type==="password"){

pass.type="text";

}else{

pass.type="password";

}

}





</script>

<script src="/js/auth.js"></script>
</body>
</html>
