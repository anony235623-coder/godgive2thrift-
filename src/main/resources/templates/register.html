<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | GodGive2Thrift</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="/css/auth.css">

</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">

        <div class="register-box">

            <div class="logo">

    <a href="/">

        GodGive2Thrift

    </a>

    <p class="logo-tagline">

        Premium Vintage Marketplace

    </p>

</div>

            <h2>

                Create Account

            </h2>

            <p>

                Join thousands of vintage fashion lovers today.

            </p>

            <div class="input-group">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name">

            </div>

            <div class="input-group">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address">

            </div>

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password">

                <i
                    class="fa-solid fa-eye eye"
                    onclick="togglePassword()"></i>

            </div>

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password">

            </div>

            <button onclick="register()">

                Create Account

            </button>

            <div class="login">

                Already have an account?

                <a href="/login">

                    Login

                </a>

            </div>

        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <div class="overlay">

            <h1>

                GodGive2Thrift

            </h1>

            <p>

                Premium Thrift Marketplace

            </p>

            <span>

                Affordable • Authentic • Vintage Fashion

            </span>

        </div>

    </div>

</div>

<script src="/js/auth.js"></script>

<script>

function togglePassword(){

    const input=document.getElementById("password");

    if(input.type==="password"){

        input.type="text";

    }else{

        input.type="password";

    }

}

</script>

</body>

</html>
