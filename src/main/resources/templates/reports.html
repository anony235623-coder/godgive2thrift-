<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales Report | GodGive2Thrift</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    transition:.25s ease;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f5f5;
}

header{

    background:#1E293B;

    color:white;

    padding:20px 40px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 4px 15px rgba(0,0,0,.15);

}

header h1{

    color:#D4AF37;

}

.backBtn{

    background:#F59E0B;

    color:white;

    padding:12px 20px;

    border:none;

    border-radius:10px;

    font-weight:600;

    cursor:pointer;

}

.backBtn:hover{

    background:#d97706;

}

.container{

    width:95%;
    max-width:1400px;

    margin:30px auto;

}

.cards{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

}

.card{

    background:white;

    border-radius:18px;

    padding:25px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

    transition:all .25s ease;

}

.card:hover{

    transform:translateY(-6px);

    box-shadow:0 18px 35px rgba(0,0,0,.12);

}

.card h2{

    color:#D4AF37;

}

.value{

    font-size:38px;

    color:#1E293B;

    font-weight:700;

}

.chartBox{

    background:white;

    border-radius:18px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}

table{
        width:100%;

border-collapse:separate;

border-spacing:0;

overflow:hidden;

border-radius:15px;

box-shadow:0 10px 20px rgba(0,0,0,.08);

}
tr:hover{

    background:#f8f8f8;

}
th{

    background:#111;

    color:white;

    padding:15px;

}

td{

    padding:15px;

    text-align:center;

    border-bottom:1px solid #eee;

}

.actions{

    text-align:right;

    margin-top:30px;

}

.actions button{

    padding:12px 20px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;

    margin-left:10px;

}

.print{

    background:#111;

    color:white;

}

.csv{

    background:#D4AF37;

}
.pdf{

    background:#dc3545;

    color:white;

}

.pdf:hover{

    background:#bb2d3b;

}

</style>

</head>

<body>

<header>

<h1>

<i class="fa-solid fa-chart-line"></i>

Sales Report

</h1>

<a href="/admin">

<button class="backBtn">

<i class="fa-solid fa-arrow-left"></i>

Back to Admin

</button>

</a>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h2>💰 Revenue</h2>

<div class="value" id="revenue">₱0</div>

</div>

<div class="card">

<h2>🛒 Orders</h2>

<div class="value" id="orders">0</div>

</div>

<div class="card">

<h2>📦 Products</h2>

<div class="value" id="products">0</div>

</div>

<div class="card">

<h2>🏷 Inventory</h2>

<div class="value" id="inventory">₱0</div>

</div>

<div class="card">

<h2>👥 Customers</h2>

<div class="value" id="customers">0</div>

</div>

<div class="card">

<h2>⏳ Pending</h2>

<div class="value" id="pending">0</div>

</div>

</div>

<br><br>

<h2>Sales Summary</h2>

<div class="cards">

<div class="card">

<h2>Today</h2>

<div class="value" id="todaySales">₱0</div>

</div>

<div class="card">

<h2>This Week</h2>

<div class="value" id="weekSales">₱0</div>

</div>

<div class="card">

<h2>This Month</h2>

<div class="value" id="monthSales">₱0</div>

</div>

</div>

<div class="chartBox">

<h2>Sales Overview</h2>

<br>

<canvas id="salesChart"></canvas>

</div>

<div class="chartBox">

<h2>Inventory Overview</h2>

<br>

<canvas id="inventoryChart"></canvas>

</div>

<h2 style="margin-top:40px;">

Recent Transactions

</h2>

<table>

<thead>

<tr>

<th>Customer</th>

<th>Product</th>

<th>Total</th>

<th>Status</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>

<div class="actions">

<button class="print" onclick="window.print()">

<i class="fa-solid fa-print"></i>

Print Report

</button>

<div class="actions">

    <button class="print" onclick="window.print()">

        <i class="fa-solid fa-print"></i>

        Print Report

    </button>

    <button class="pdf" onclick="exportPDF()">

        <i class="fa-solid fa-file-pdf"></i>

        Export PDF

    </button>

    <button class="csv" onclick="exportCSV()">

        <i class="fa-solid fa-file-csv"></i>

        Export CSV

    </button>

</div>
<i class="fa-solid fa-file-pdf"></i>

Export PDF

</button>

<i class="fa-solid fa-file-csv"></i>

Export CSV

</button>

</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/js/reports.js"></script>

</body>
</html>
